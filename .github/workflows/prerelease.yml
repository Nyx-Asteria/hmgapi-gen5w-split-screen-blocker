name: Prerelease (test-signed)

on:
  push:
    branches: [main]
    tags:
      - "v*-rc.*"
      - "v*-beta.*"
      - "v*-alpha.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android build dependencies
        run: |
          set -eu
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-19" "build-tools;35.0.0"
      - name: Fetch HMG-API SDK source
        uses: actions/checkout@v4
        with:
          repository: Open-HMG/HMG-API
          path: .hmgapi
      - name: Build HMG-API mod SDK
        run: |
          cd .hmgapi
          ./build.sh sdk
      - name: Build and verify disposable test-signed packages
        run: |
          set -eu
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-19/android.jar"
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          SDK_ZIP=$(find .hmgapi/out/dist -maxdepth 1 -name 'hmgapi-mod-sdk-*.zip' -print -quit)
          test -n "$SDK_ZIP"
          mkdir -p "$RUNNER_TEMP/hmgapi-sdk"
          unzip -q "$SDK_ZIP" -d "$RUNNER_TEMP/hmgapi-sdk"
          export HMGAPI_CP="$RUNNER_TEMP/hmgapi-sdk/lib/hmgapi-engine.jar"
          export MKNEMESISMOD="$RUNNER_TEMP/hmgapi-sdk/bin/mknemesismod.sh"
          test -f "$HMGAPI_CP"
          test -f "$MKNEMESISMOD"
          chmod +x gen5w-split-screen-blocker/build.sh
          (cd gen5w-split-screen-blocker && ./build.sh)
          mkdir -p release-assets
          cp gen5w-split-screen-blocker/out/*.zip gen5w-split-screen-blocker/out/SHA256SUMS release-assets/
      - name: Publish prerelease
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(python3 -c 'import json;print(json.load(open("gen5w-split-screen-blocker/mod.json"))["version"])')
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then test "$GITHUB_REF_NAME" = "$tag"; fi
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release $tag already exists; skipping"; exit 0; fi
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Gen5W Split Screen Blocker $version (Experimental)" \
            --notes-file .github/release-notes/v1.2.0-rc.1.md
      - name: Upload test packages from manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gen5w-test-packages
          path: release-assets/
